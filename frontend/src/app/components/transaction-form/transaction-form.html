<div class="form-card">
  <div class="form-header" [class.is-editing]="editItem">
    <h3 class="form-title">
      {{ editItem ? "Transaktion bearbeiten" : "Neue Transaktion hinzufügen" }}
    </h3>
  </div>

  <div class="form-body">
    <form (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <!-- Titel -->
        <div class="form-field">
          <label class="field-label">Titel</label>
          <input 
            type="text" 
            class="field-input" 
            placeholder="z. B. Gehalt, Supermarkt" 
            [(ngModel)]="title" 
            name="title" 
            required>
        </div>

        <!-- Betrag -->
        <div class="form-field">
          <label class="field-label">Betrag (€)</label>
          <input 
            type="number" 
            step="0.01" 
            class="field-input" 
            placeholder="0.00" 
            [(ngModel)]="amount" 
            name="amount" 
            required>
        </div>

        <!-- Typ -->
        <div class="form-field">
          <label class="field-label">Typ</label>
          <select class="field-select" [(ngModel)]="type" name="type">
            <option value="expense">Ausgabe</option>
            <option value="income">Einnahme</option>
          </select>
        </div>

        <!-- Kategorie -->
        <div class="form-field">
          <label class="field-label">Kategorie</label>
          <input 
            type="text" 
            class="field-input" 
            placeholder="z. B. Essen, Miete" 
            [(ngModel)]="category" 
            name="category">
        </div>

        <!-- Datum  -->
        <div class="form-field">
          <label class="field-label">Datum</label>
          <input 
            type="date" 
            class="field-input" 
            [(ngModel)]="date" 
            name="date">
        </div>
      </div> 

      <!-- Aktionen -->
      <div class="form-actions">
        <button 
          *ngIf="editItem" 
          type="button" 
          class="btn btn-cancel" 
          (click)="onCancel()">
          Abbrechen
        </button>
        <button 
          type="submit" 
          class="btn" 
          [class.btn-edit]="editItem" 
          [class.btn-save]="!editItem">
          {{ editItem ? 'Änderungen speichern' : 'Hinzufügen' }}
        </button>
      </div>
    </form>
  </div>
</div>
