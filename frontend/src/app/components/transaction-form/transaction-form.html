
<div class="card shadow-sm mb-4">
    <div class="card-header" [ngClass]="editItem ? 'bg-warning text-dark' : 'bg-primary text-white'">
        <h5 class="mb-0">{{ editItem ? "Transaktion bearbeiten" : "Neue Transaktion hinzufügen" }}</h5>
    </div>
    <div class="card-body">
        <form (ngSubmit)="onSubmit()">
            <div class="row g-3">
                <!-- Titel -->
                <div class="col-md-4">
                    <label class="form-label">Titel</label>
                    <input type="text" class="form-control" placeholder="z.B Gehalt, Supermarkt" [(ngModel)]="title" name="title" required>
                </div>
                <!-- Betrag-->
                <div class="col-md-3">
                    <label class="form-label">Betrag (€)</label>
                    <input type="number" step="0.01" class="form-control" placeholder="0.00" [(ngModel)]="amount" name="amount" required>
                </div>
          <!-- Typ -->
        <div class="col-md-2">
            <label class="form-label">Typ</label>
            <select class="form-select" [(ngModel)]="type" name="type">
              <option value="expense">Ausgabe</option>
              <option value="income">Einnahme</option>
            </select>
          </div>
  
          <!-- Kategorie -->
          <div class="col-md-3">
            <label class="form-label">Kategorie</label>
            <input type="text" class="form-control" placeholder="z. B. Essen, Miete" [(ngModel)]="category" name="category">
          </div>
        </div>

        <!-- Datum -->
         <div class="col-md-4">
          <label class="form-label">Datum</label>
          <input type="date" class="form-control" [(ngModel)]="date" name="date">
         </div>
  
        <!-- Submit Button -->
        <div class="mt-3 text-end">
          <button *ngIf="editItem" type="button" class="btn btn-secondary me-2" (click)="onCancel()">Abbrechen</button>
          <button type="submit" class="btn" [ngClass]="editItem ? 'btn-warning' : 'btn-success'">
            {{ editItem ? 'Änderungen speichern' : 'Hinzufügen' }}
            </button>
          </div>
      </form>
    </div>
</div>
