<div class="card shadow-sm mt-4">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Transaktionsübersicht</h5>
    </div>
    <div class="card-body">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Titel</th>
            <th>Kategorie</th>
            <th>Typ</th>
            <th>Betrag</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of transactions">
            <td>{{ t.title }}</td>
            <td>{{ t.category || '-' }}</td>
            <td>
              <span class="badge" [ngClass]="t.type === 'income' ? 'bg-success' : 'bg-danger'">
                {{ t.type }}
              </span>
            </td>
            <td>{{ t.amount }} €</td>
            <td>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteTransaction(t._id)">
                Löschen
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
