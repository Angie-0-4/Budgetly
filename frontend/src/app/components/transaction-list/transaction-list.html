
<!-- Dashboard-->
<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card bg-success text-white shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-uppercase mb-1">Gesamteinnahmen</h6>
        <h3 class="card-text mb-0">+{{ totalIncome | number:'1.2-2' }} €</h3>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card bg-danger text-white shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-uppercase mb-1">Gesamtausgaben</h6>
        <h3 class="card-text mb-0">-{{ totalExpense | number:'1.2-2' }} €</h3>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card text-white shadow-sm" [ngClass]="balance >= 0 ? 'bg-primary' : 'bg-warning text-dark'">
      <div class="card-body">
        <h6 class="card-title text-uppercase mb-1">Aktueller Kontostand</h6>
        <h3 class="card-text mb-0">{{ balance | number:'1.2-2' }} €</h3>
      </div>
    </div>
  </div>
</div>

<!-- Tabelle -->
<div class="card shadow-sm mt-4">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Transaktionsübersicht</h5>
    </div>
    <div class="card-body">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Titel</th>
            <th>Kategorie</th>
            <th>Typ</th>
            <th>Betrag</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of transactions">
            <td>{{ t.title }}</td>
            <td>{{ t.category || '-' }}</td>
            <td>
              <span class="badge" [ngClass]="t.type === 'income' ? 'bg-success' : 'bg-danger'">
                {{ t.type }}
              </span>
            </td>
            <td>{{ t.amount }} €</td>
            <td>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteTransaction(t._id)">
                Löschen
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
