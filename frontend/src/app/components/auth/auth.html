<div class="row justify-content-center mt-5">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
          <h4 class="mb-0">{{ isLoginMode ? 'Budgetly Login' : 'Neues Konto erstellen' }}</h4>
        </div>
        <div class="card-body p-4">
          <div *ngIf="errorMessage" class="alert alert-danger py-2">{{ errorMessage }}</div>
          <div *ngIf="successMessage" class="alert alert-success py-2">{{ successMessage }}</div>
  
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Benutzername</label>
              <input type="text" class="form-control" [(ngModel)]="username" name="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Passwort</label>
              <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">
              {{ isLoginMode ? 'Anmelden' : 'Registrieren' }}
            </button>
          </form>
  
          <div class="text-center">
            <button class="btn btn-link text-decoration-none btn-sm" (click)="toggleMode()">
              {{ isLoginMode ? 'Noch kein Konto? Hier registrieren' : 'Bereits ein Konto? Zum Login' }}
            </button>
          </div>
          
  <div class="text-center mt-3">
    <button 
     type="button" 
      class="btn btn-link" 
      (click)="isLoginMode = true">
      Bereits ein Konto? Zum Login
    </button>
  </div>
        </div>
      </div>
    </div>
  </div>
