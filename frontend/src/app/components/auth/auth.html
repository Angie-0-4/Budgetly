<!-- Auth Container -->
<div class="auth-wrapper">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <h4 class="auth-title">{{ isLoginMode ? 'Budgetly Login' : 'Neues Konto erstellen' }}</h4>
    </div>

    <!-- Body & Formular -->
    <div class="auth-body">
      <!-- Statusmeldungen -->
      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

      <!-- Eingabe-Formular -->
      <form (ngSubmit)="onSubmit()">
        <!-- Benutzername -->
        <div class="form-group">
          <label class="form-label">Benutzername</label>
          <input 
            type="text" 
            class="form-control" 
            [(ngModel)]="username" 
            name="username" 
            required>
        </div>

        <!-- Passwort -->
        <div class="form-group">
          <label class="form-label">Passwort</label>
          <input 
            type="password" 
            class="form-control" 
            [(ngModel)]="password" 
            name="password" 
            required>
        </div>

        <!-- Absende-Button -->
        <button type="submit" class="btn-primary">
          {{ isLoginMode ? 'Anmelden' : 'Registrieren' }}
        </button>
      </form>

      <!-- Umschalt-Button (Login / Registrieren) -->
      <div class="toggle-wrapper">
        <button type="button" class="btn-toggle" (click)="toggleMode()">
          {{ isLoginMode ? 'Noch kein Konto? Hier registrieren' : 'Bereits ein Konto? Zum Login' }}
        </button>
      </div>
    </div>
  </div>
</div>
